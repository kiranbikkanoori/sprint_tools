<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Sub-task validation tables shape</title>
  <desc id="desc">Mock shared by the two sub-task validation tables: remaining work and worklogs on sub-tasks.</desc>
  <rect width="1200" height="240" rx="20" fill="#F7F9FC"/>
  <rect x="1" y="1" width="1198" height="238" rx="19" fill="none" stroke="#D5DEEC"/>
  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Sub-task validation</text>
  <text x="40" y="68" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748B">Two similar tables  |  empty is a good result</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" transform="translate(40 90)">
    <rect width="1120" height="32" fill="#EEF3FA"/>
    <text x="12" y="21" font-weight="700" fill="#0B3D91">Ticket</text>
    <text x="180" y="21" font-weight="700" fill="#0B3D91">Assignee</text>
    <text x="380" y="21" font-weight="700" fill="#0B3D91">Parent</text>
    <text x="560" y="21" font-weight="700" fill="#0B3D91">Remaining / Hours</text>
    <text x="820" y="21" font-weight="700" fill="#0B3D91">Summary</text>

    <rect y="32" width="1120" height="36" fill="#FFFFFF"/>
    <text x="12" y="55" fill="#2176FF">PROJ-220</text>
    <text x="180" y="55" fill="#334155">Alex</text>
    <text x="380" y="55" fill="#334155">PROJ-100</text>
    <text x="560" y="55" fill="#B45309">4h remaining</text>
    <text x="820" y="55" fill="#64748B">Child still open</text>

    <rect y="68" width="1120" height="36" fill="#FAFBFC"/>
    <text x="12" y="91" fill="#2176FF">PROJ-221</text>
    <text x="180" y="91" fill="#334155">Sam</text>
    <text x="380" y="91" fill="#334155">PROJ-101</text>
    <text x="560" y="91" fill="#B45309">1.5h on sub-task</text>
    <text x="820" y="91" fill="#64748B">Logged under child</text>
  </g>
</svg>
