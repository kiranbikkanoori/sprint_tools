<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Sprint tickets status table shape</title>
  <desc id="desc">Mock of the Sprint Tickets Status and Remaining Work table, unfinished first.</desc>
  <rect width="1200" height="240" rx="20" fill="#F7F9FC"/>
  <rect x="1" y="1" width="1198" height="238" rx="19" fill="none" stroke="#D5DEEC"/>
  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Sprint Tickets - Status and Remaining Work</text>
  <text x="40" y="68" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748B">Unfinished tickets sorted to the top</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" transform="translate(40 90)">
    <rect width="1120" height="32" fill="#EEF3FA"/>
    <text x="12" y="21" font-weight="700" fill="#0B3D91">Key</text>
    <text x="130" y="21" font-weight="700" fill="#0B3D91">Summary</text>
    <text x="380" y="21" font-weight="700" fill="#0B3D91">Type</text>
    <text x="480" y="21" font-weight="700" fill="#0B3D91">Assignee</text>
    <text x="640" y="21" font-weight="700" fill="#0B3D91">Status</text>
    <text x="800" y="21" font-weight="700" fill="#0B3D91">Est (h)</text>
    <text x="920" y="21" font-weight="700" fill="#0B3D91">Rem (h)</text>
    <text x="1060" y="21" font-weight="700" fill="#0B3D91">SP</text>

    <rect y="32" width="1120" height="34" fill="#FFF7ED"/>
    <text x="12" y="54" fill="#2176FF">PROJ-310</text>
    <text x="130" y="54" fill="#334155">Still open work...</text>
    <text x="380" y="54" fill="#334155">Story</text>
    <text x="480" y="54" fill="#334155">Alex</text>
    <text x="640" y="54" fill="#B45309">In Progress</text>
    <text x="800" y="54" fill="#334155">16.0</text>
    <text x="920" y="54" fill="#B45309">8.0</text>
    <text x="1060" y="54" fill="#334155">3</text>

    <rect y="66" width="1120" height="34" fill="#FFFFFF"/>
    <text x="12" y="88" fill="#2176FF">PROJ-208</text>
    <text x="130" y="88" fill="#334155">Done but rem left...</text>
    <text x="380" y="88" fill="#334155">Task</text>
    <text x="480" y="88" fill="#334155">Sam</text>
    <text x="640" y="88" fill="#64748B">Resolved</text>
    <text x="800" y="88" fill="#334155">8.0</text>
    <text x="920" y="88" fill="#DC2626">2.0 !</text>
    <text x="1060" y="88" fill="#334155">2</text>

    <rect y="100" width="1120" height="34" fill="#FAFBFC"/>
    <text x="12" y="122" fill="#2176FF">PROJ-190</text>
    <text x="130" y="122" fill="#334155">Closed cleanly...</text>
    <text x="380" y="122" fill="#334155">Story</text>
    <text x="480" y="122" fill="#334155">Alex</text>
    <text x="640" y="122" fill="#64748B">Closed</text>
    <text x="800" y="122" fill="#334155">8.0</text>
    <text x="920" y="122" fill="#334155">0.0</text>
    <text x="1060" y="122" fill="#334155">2</text>
  </g>
</svg>
