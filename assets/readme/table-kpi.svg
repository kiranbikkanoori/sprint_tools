<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Sprint KPI Summary table shape</title>
  <desc id="desc">Mock of the KPI summary table with label, value, and notes columns.</desc>
  <rect width="1200" height="280" rx="20" fill="#F7F9FC"/>
  <rect x="1" y="1" width="1198" height="278" rx="19" fill="none" stroke="#D5DEEC"/>
  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Sprint KPI Summary</text>
  <text x="40" y="68" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748B">One row per KPI  |  some values still N/A</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" transform="translate(40 90)">
    <rect width="1120" height="32" fill="#EEF3FA"/>
    <text x="16" y="21" font-weight="700" fill="#0B3D91">KPI</text>
    <text x="520" y="21" font-weight="700" fill="#0B3D91">Value</text>
    <text x="700" y="21" font-weight="700" fill="#0B3D91">Notes</text>

    <rect y="32" width="1120" height="30" fill="#FFFFFF"/>
    <text x="16" y="52" fill="#334155">Sprint completion rate</text>
    <text x="520" y="52" font-weight="700" fill="#2176FF">83%</text>
    <text x="700" y="52" fill="#64748B">done / accepted Stories+Tasks</text>

    <rect y="62" width="1120" height="30" fill="#FAFBFC"/>
    <text x="16" y="82" fill="#334155">Sprint velocity</text>
    <text x="520" y="82" font-weight="700" fill="#0F172A">0.70</text>
    <text x="700" y="82" fill="#64748B">SP delivered / effective days</text>

    <rect y="92" width="1120" height="30" fill="#FFFFFF"/>
    <text x="16" y="112" fill="#334155">Scope stability and backlog churn</text>
    <text x="520" y="112" font-weight="700" fill="#0F172A">1</text>
    <text x="700" y="112" fill="#64748B">tickets added after start</text>

    <rect y="122" width="1120" height="30" fill="#FAFBFC"/>
    <text x="16" y="142" fill="#334155">Number of tickets / completed / differed</text>
    <text x="520" y="142" font-weight="700" fill="#0F172A">18 / 15 / 3</text>
    <text x="700" y="142" fill="#64748B">committed vs done</text>

    <rect y="152" width="1120" height="30" fill="#FFFFFF"/>
    <text x="16" y="172" fill="#94A3B8">Participation, ceremony, hygiene, ...</text>
    <text x="520" y="172" fill="#94A3B8">N/A</text>
    <text x="700" y="172" fill="#94A3B8">not implemented yet</text>
  </g>
</svg>
