<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sprint Report capsule navigation</title>
  <desc id="desc">Help, Settings, Sprint, Configure, and Generate as top capsule tabs from credentials to report review.</desc>

  <rect width="1200" height="300" rx="26" fill="#F7F9FC"/>
  <rect x="1" y="1" width="1198" height="298" rx="25" fill="none" stroke="#D5DEEC"/>

  <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0B3D91" letter-spacing="1.4">HOW IT WORKS</text>
  <text x="56" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#0F172A">Top capsules. From Help to Generate.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(40 110)">
      <rect width="200" height="150" rx="16" fill="#FFFFFF" stroke="#D5DEEC"/>
      <rect x="16" y="16" width="36" height="36" rx="18" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="34" y="39" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#0B3D91">?</text>
      <text x="64" y="40" font-size="17" font-weight="700" fill="#0F172A">Help</text>
      <text x="16" y="78" font-size="13" fill="#475569">This guide in-app</text>
      <text x="16" y="100" font-size="13" fill="#475569">Same as README</text>
      <rect x="16" y="118" width="72" height="22" rx="11" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="52" y="133" text-anchor="middle" font-size="11" fill="#0F172A">Help</text>
    </g>

    <path d="M252 185 H276" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M268 177 L280 185 L268 193" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(288 110)">
      <rect width="200" height="150" rx="16" fill="#FFFFFF" stroke="#D5DEEC"/>
      <rect x="16" y="16" width="36" height="36" rx="10" fill="#2176FF"/>
      <text x="34" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
      <text x="64" y="40" font-size="17" font-weight="700" fill="#0F172A">Settings</text>
      <text x="16" y="78" font-size="13" fill="#475569">Jira URL + PAT</text>
      <text x="16" y="100" font-size="13" fill="#475569">Encrypted locally</text>
      <rect x="16" y="118" width="84" height="22" rx="11" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="58" y="133" text-anchor="middle" font-size="11" fill="#0F172A">Settings</text>
    </g>

    <path d="M500 185 H524" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M516 177 L528 185 L516 193" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(536 110)">
      <rect width="200" height="150" rx="16" fill="#FFFFFF" stroke="#D5DEEC"/>
      <rect x="16" y="16" width="36" height="36" rx="10" fill="#2176FF"/>
      <text x="34" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
      <text x="64" y="40" font-size="17" font-weight="700" fill="#0F172A">Sprint</text>
      <text x="16" y="78" font-size="13" fill="#475569">Board + sprint</text>
      <text x="16" y="100" font-size="13" fill="#475569">Load issues</text>
      <rect x="16" y="118" width="72" height="22" rx="11" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="52" y="133" text-anchor="middle" font-size="11" fill="#0F172A">Sprint</text>
    </g>

    <path d="M748 185 H772" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M764 177 L776 185 L764 193" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(784 110)">
      <rect width="176" height="150" rx="16" fill="#FFFFFF" stroke="#D5DEEC"/>
      <rect x="16" y="16" width="36" height="36" rx="10" fill="#2176FF"/>
      <text x="34" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
      <text x="60" y="40" font-size="16" font-weight="700" fill="#0F172A">Configure</text>
      <text x="16" y="78" font-size="13" fill="#475569">Team, leaves</text>
      <text x="16" y="100" font-size="13" fill="#475569">Exclusions</text>
      <rect x="16" y="118" width="88" height="22" rx="11" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="60" y="133" text-anchor="middle" font-size="11" fill="#0F172A">Configure</text>
    </g>

    <path d="M972 185 H996" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M988 177 L1000 185 L988 193" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1008 110)">
      <rect width="152" height="150" rx="16" fill="#2176FF"/>
      <rect x="16" y="16" width="36" height="36" rx="10" fill="#FFFFFF" fill-opacity="0.2"/>
      <text x="34" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
      <text x="60" y="40" font-size="16" font-weight="700" fill="#FFFFFF">Generate</text>
      <text x="16" y="78" font-size="13" fill="#E8F1FF">Review tabs</text>
      <text x="16" y="100" font-size="13" fill="#E8F1FF">HTML + MD</text>
      <rect x="16" y="118" width="84" height="22" rx="11" fill="#FFFFFF"/>
      <text x="58" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="#2176FF">Generate</text>
    </g>
