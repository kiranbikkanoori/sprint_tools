    <text x="16" y="88" font-size="12" font-weight="600" fill="#2176FF">RSCDEV-1502</text>
    <text x="140" y="88" font-size="12" fill="#334155">In Progress</text>
    <text x="260" y="88" font-size="12" fill="#334155">8.0</text>
    <text x="400" y="88" font-size="12" fill="#334155">3</text>
