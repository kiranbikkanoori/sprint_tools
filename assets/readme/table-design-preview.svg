<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Generate tables - design preview</title>
  <desc id="desc">Proposed non-Excel table language for Hours, Fix-ups, Tickets, and KPIs tabs.</desc>

  <rect width="1200" height="980" rx="26" fill="#F7F9FC"/>
  <rect x="1" y="1" width="1198" height="978" rx="25" fill="none" stroke="#D5DEEC"/>

  <text x="48" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0B3D91" letter-spacing="1.4">TABLE DESIGN PREVIEW</text>
  <text x="48" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Less Excel grid. More report card.</text>
  <text x="48" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">File: assets/readme/table-design-preview.svg - Review before app implementation</text>

  <g transform="translate(48 118)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">
    <rect width="1104" height="44" rx="10" fill="#FFFFFF" stroke="#D5DEEC"/>
    <text x="16" y="27" fill="#64748B">Tokens:</text>
    <rect x="70" y="12" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#D5DEEC"/>
    <text x="94" y="27" fill="#334155">surface</text>
    <rect x="160" y="12" width="18" height="18" rx="4" fill="#EEF3FA"/>
    <text x="184" y="27" fill="#334155">header</text>
    <rect x="250" y="12" width="18" height="18" rx="4" fill="#E8F0FF"/>
    <text x="274" y="27" fill="#334155">total / accent wash</text>
    <rect x="410" y="12" width="18" height="18" rx="4" fill="#FFF7ED"/>
    <text x="434" y="27" fill="#334155">warn row</text>
    <text x="520" y="27" fill="#64748B">rounded card 12px | hairline rows | no vertical borders | soft header</text>
  </g>

