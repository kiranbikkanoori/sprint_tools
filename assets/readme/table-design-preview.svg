    <text x="860" y="132" font-size="13" font-weight="700" fill="#0F172A">0.70</text>
    <text x="960" y="132" font-size="11" fill="#64748B">SP / person-day</text>
    <path d="M572 148 H1092" stroke="#E8EEF5"/>

    <text x="576" y="176" font-size="12" fill="#94A3B8">Participation rate</text>
    <text x="860" y="176" font-size="12" fill="#94A3B8">N/A</text>
    <text x="960" y="176" font-size="11" fill="#94A3B8">not implemented</text>
    <text x="576" y="208" font-size="11" fill="#64748B">Key metrics bold; N/A stays quiet</text>
