    <text x="220" y="62" font-size="12" font-weight="700" fill="#0B3D91">May 27</text>
    <text x="460" y="62" font-size="12" font-weight="700" fill="#0B3D91">May 28</text>
    <text x="720" y="62" font-size="12" font-weight="700" fill="#0B3D91">Logged</text>
    <text x="860" y="62" font-size="12" font-weight="700" fill="#0B3D91">Remaining</text>
    <text x="1000" y="62" font-size="12" font-weight="700" fill="#0B3D91">Capacity</text>

    <text x="20" y="112" font-size="13" font-weight="600" fill="#0F172A">Alex Developer</text>
