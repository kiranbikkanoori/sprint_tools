    <text x="16" y="132" font-size="12" font-weight="600" fill="#2176FF">RSCDEV-1204</text>
    <text x="140" y="132" font-size="12" fill="#9A3412">Resolved</text>
    <text x="260" y="132" font-size="12" font-weight="700" fill="#DC2626">2.0 WARN</text>
    <text x="400" y="132" font-size="12" fill="#9A3412">5</text>
    <path d="M12 149 H508" stroke="#FED7AA"/>

    <text x="16" y="178" font-size="12" font-weight="600" fill="#2176FF">RSCDEV-1101</text>
    <text x="140" y="178" font-size="12" fill="#334155">Closed</text>
    <text x="260" y="178" font-size="12" fill="#334155">0.0</text>
    <text x="400" y="178" font-size="12" fill="#334155">2</text>
