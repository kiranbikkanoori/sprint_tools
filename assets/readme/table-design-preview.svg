  <text x="48" y="920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0F172A">Rules for implementation (if approved)</text>
  <text x="48" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#475569">1) Outer card only - no vertical grid lines.  2) Soft header wash.  3) Hairline row separators.  4) Team total / warn as tinted bands.  5) Keys accent blue.  6) Dark theme mirrors tokens.</text>
  <text x="48" y="964" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Not in this pass: multi-team stacking (comes after table styling is locked).</text>
</svg>
