<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">In-app Hours tab - one combined table</title>
  <desc id="desc">Single Hours matrix with colored ticket-key chips per day, plus Logged, Remaining, and Capacity.</desc>

  <rect width="1200" height="300" rx="20" fill="#F7F9FC"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#D5DEEC"/>

  <text x="40" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Hours tab (in-app) - one combined table</text>
  <text x="40" y="62" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748B">Stories + Tasks together  |  chips = ticket keys by type</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" transform="translate(40 82)">
    <rect width="1120" height="32" fill="#EEF3FA"/>
    <text x="12" y="21" font-weight="700" fill="#0B3D91">Person</text>
    <text x="200" y="21" font-weight="700" fill="#0B3D91">May 27</text>
    <text x="420" y="21" font-weight="700" fill="#0B3D91">May 28</text>
    <text x="640" y="21" font-weight="700" fill="#0B3D91">Logged</text>
    <text x="780" y="21" font-weight="700" fill="#0B3D91">Remaining</text>
    <text x="960" y="21" font-weight="700" fill="#0B3D91">Capacity</text>

    <rect y="32" width="1120" height="72" fill="#FFFFFF"/>
    <text x="12" y="60" font-size="12" fill="#334155">Alex Developer</text>
    <rect x="200" y="42" width="100" height="20" rx="4" fill="#DBEAFE"/>
    <text x="250" y="56" text-anchor="middle" font-size="10" font-weight="600" fill="#0C4A6E">RSCDEV-1204</text>
    <rect x="200" y="66" width="100" height="20" rx="4" fill="#EDE9FE"/>
    <text x="250" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#5B21B6">RSCDEV-1211</text>
    <rect x="420" y="42" width="100" height="20" rx="4" fill="#DBEAFE"/>
    <text x="470" y="56" text-anchor="middle" font-size="10" font-weight="600" fill="#0C4A6E">RSCDEV-1204</text>
    <text x="640" y="70" font-size="13" font-weight="700" fill="#0F172A">14.0</text>
    <text x="780" y="70" font-size="13" font-weight="700" fill="#0F172A">12.0</text>
    <text x="960" y="70" font-size="13" font-weight="700" fill="#0F172A">72.0</text>

    <rect y="104" width="1120" height="72" fill="#FAFBFC"/>
    <text x="12" y="132" font-size="12" fill="#334155">Sam Engineer</text>
    <rect x="200" y="114" width="100" height="20" rx="4" fill="#EDE9FE"/>
    <text x="250" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#5B21B6">RSCDEV-1302</text>
    <rect x="420" y="114" width="100" height="20" rx="4" fill="#FEE2E2"/>
    <text x="470" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">RSCDEV-1310</text>
    <text x="420" y="154" font-size="10" fill="#991B1B">sub-task (not allowed)</text>
    <text x="640" y="142" font-size="13" font-weight="700" fill="#0F172A">10.0</text>
    <text x="780" y="142" font-size="13" font-weight="700" fill="#0F172A">4.5</text>
    <text x="960" y="142" font-size="13" font-weight="700" fill="#0F172A">64.0</text>

    <rect y="176" width="1120" height="36" fill="#F0F4FF"/>
    <text x="12" y="199" font-size="12" font-weight="700" fill="#0B3D91">Team total</text>
    <text x="640" y="199" font-size="13" font-weight="700" fill="#2176FF">24.0</text>
    <text x="780" y="199" font-size="13" font-weight="700" fill="#2176FF">16.5</text>
    <text x="960" y="199" font-size="13" font-weight="700" fill="#2176FF">136.0</text>
  </g>
</svg>
