<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Sprint Report</title>
  <desc id="desc">Desktop app that turns a Jira sprint into a markdown report and burndown chart in four guided steps.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F7FC"/>
      <stop offset="100%" stop-color="#E8EEF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#D5DEEC" stroke-width="1"/>

  <g id="title-block" transform="translate(56 48)">
    <rect x="0" y="0" width="118" height="28" rx="8" fill="#2176FF" fill-opacity="0.12"/>
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0B3D91" letter-spacing="1.2">DESKTOP APP</text>

    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="760" fill="#0F172A">Sprint Report</text>
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#334155">From Jira sprint to markdown report</text>
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#334155">and burndown chart - in four steps.</text>

    <g transform="translate(0 196)">
      <rect x="0" y="0" width="44" height="44" rx="12" fill="#2176FF"/>
      <text x="22" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
      <rect x="56" y="20" width="28" height="4" rx="2" fill="#2176FF" fill-opacity="0.35"/>
      <rect x="96" y="0" width="44" height="44" rx="12" fill="#FFFFFF" stroke="#2176FF" stroke-width="2"/>
      <text x="118" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#2176FF">2</text>
      <rect x="152" y="20" width="28" height="4" rx="2" fill="#2176FF" fill-opacity="0.35"/>
      <rect x="192" y="0" width="44" height="44" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
      <text x="214" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#64748B">3</text>
      <rect x="248" y="20" width="28" height="4" rx="2" fill="#94A3B8" fill-opacity="0.45"/>
      <rect x="288" y="0" width="44" height="44" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
      <text x="310" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#64748B">4</text>

      <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748B">Settings -&gt; Sprint -&gt; Configure -&gt; Generate</text>
      <text x="0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94A3B8">v0.1.4  |  PySide6  |  SprintReport.exe</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(620 40)">
    <rect x="0" y="0" width="524" height="300" rx="16" fill="#FFFFFF" stroke="#C9D4E6" stroke-width="1.5"/>
    <rect x="0" y="0" width="524" height="36" rx="16" fill="#EEF3FA"/>
    <rect x="0" y="20" width="524" height="16" fill="#EEF3FA"/>
    <circle cx="22" cy="18" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="58" cy="18" r="5" fill="#28C840"/>
    <text x="262" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#475569">Sprint Report v0.1.4</text>

    <rect x="12" y="48" width="120" height="240" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="20" y="60" width="104" height="30" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">1. Settings</text>
    <rect x="20" y="98" width="104" height="30" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">2. Sprint</text>
    <rect x="20" y="136" width="104" height="30" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="32" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">3. Configure</text>
    <rect x="20" y="174" width="104" height="30" rx="8" fill="#2176FF"/>
    <text x="32" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">4. Generate</text>

    <text x="150" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0F172A">Preview | Wi-Fi_LMAC_2026_11</text>
    <text x="150" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">Inline report + burndown chart</text>

    <g transform="translate(150 110)">
      <rect x="0" y="70" width="18" height="50" fill="#2176FF"/>
      <rect x="0" y="50" width="18" height="20" fill="#F59E0B"/>
      <rect x="0" y="30" width="18" height="20" fill="#14B8A6"/>

      <rect x="28" y="55" width="18" height="65" fill="#2176FF"/>
      <rect x="28" y="35" width="18" height="20" fill="#F59E0B"/>
      <rect x="28" y="18" width="18" height="17" fill="#14B8A6"/>
      <rect x="28" y="8" width="18" height="10" fill="#A855F7"/>

      <rect x="56" y="60" width="18" height="60" fill="#2176FF"/>
      <rect x="56" y="42" width="18" height="18" fill="#F59E0B"/>
      <rect x="56" y="24" width="18" height="18" fill="#14B8A6"/>

      <rect x="84" y="48" width="18" height="72" fill="#2176FF"/>
      <rect x="84" y="30" width="18" height="18" fill="#F59E0B"/>
      <rect x="84" y="12" width="18" height="18" fill="#14B8A6"/>
      <rect x="84" y="0" width="18" height="12" fill="#EC4899"/>

      <rect x="112" y="52" width="18" height="68" fill="#2176FF"/>
      <rect x="112" y="34" width="18" height="18" fill="#F59E0B"/>
      <rect x="112" y="16" width="18" height="18" fill="#14B8A6"/>

      <rect x="140" y="78" width="18" height="42" fill="#2176FF"/>
      <rect x="140" y="62" width="18" height="16" fill="#F59E0B"/>

      <rect x="168" y="40" width="18" height="80" fill="#2176FF"/>
      <rect x="168" y="22" width="18" height="18" fill="#F59E0B"/>
      <rect x="168" y="8" width="18" height="14" fill="#14B8A6"/>
      <rect x="168" y="0" width="18" height="8" fill="#22D3EE"/>

      <line x1="0" y1="120" x2="190" y2="120" stroke="#CBD5E1" stroke-width="1"/>
      <text x="0" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#94A3B8">hours logged / working day</text>
    </g>

    <g transform="translate(360 110)">
      <rect x="0" y="0" width="140" height="54" rx="10" fill="#F7FAFF" stroke="#D6E4FF"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">Completion</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#2176FF">83%</text>

      <rect x="0" y="66" width="140" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">Tickets done</text>
      <text x="12" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0F172A">15 / 18</text>
    </g>

    <rect x="150" y="262" width="350" height="18" rx="6" fill="#EEF3FA"/>
    <text x="162" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">sprint_report_*.md  |  sprint_burndown_*.png</text>
  </g>
</svg>
