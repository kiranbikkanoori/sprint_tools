<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Sprint Report</title>
  <desc id="desc">Desktop app with top capsule navigation and native Generate review tabs for a Jira sprint report.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F7FC"/>
      <stop offset="100%" stop-color="#E8EEF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#D5DEEC" stroke-width="1"/>

  <g id="title-block" transform="translate(56 48)">
    <rect x="0" y="0" width="118" height="28" rx="8" fill="#2176FF" fill-opacity="0.12"/>
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0B3D91" letter-spacing="1.2">DESKTOP APP</text>

    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="760" fill="#0F172A">Sprint Report</text>
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#334155">From Jira sprint to HTML + markdown</text>
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#334155">with native Overview · Hours · Fix-ups · KPIs.</text>

    <g transform="translate(0 196)">
      <rect x="0" y="0" width="72" height="32" rx="16" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="36" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#0F172A">Help</text>
      <rect x="80" y="0" width="84" height="32" rx="16" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="122" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#0F172A">Settings</text>
      <rect x="172" y="0" width="72" height="32" rx="16" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="208" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#0F172A">Sprint</text>
      <rect x="252" y="0" width="96" height="32" rx="16" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="300" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#0F172A">Configure</text>
      <rect x="356" y="0" width="92" height="32" rx="16" fill="#2176FF"/>
      <text x="402" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Generate</text>

      <text x="0" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748B">Top capsules  ·  then Generate review tabs</text>
      <text x="0" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94A3B8">v0.1.10  |  PySide6  |  SprintReport.exe</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(580 36)">
    <rect x="0" y="0" width="564" height="308" rx="16" fill="#FFFFFF" stroke="#C9D4E6" stroke-width="1.5"/>
    <rect x="0" y="0" width="564" height="36" rx="16" fill="#EEF3FA"/>
    <rect x="0" y="20" width="564" height="16" fill="#EEF3FA"/>
    <circle cx="22" cy="18" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="58" cy="18" r="5" fill="#28C840"/>
    <text x="282" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#475569">Sprint Report v0.1.10</text>

    <!-- top app capsules strip -->
    <g transform="translate(16 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">
      <rect width="50" height="22" rx="11" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="25" y="15" text-anchor="middle" fill="#64748B">Help</text>
      <rect x="56" y="0" width="58" height="22" rx="11" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="85" y="15" text-anchor="middle" fill="#64748B">Settings</text>
      <rect x="120" y="0" width="52" height="22" rx="11" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="146" y="15" text-anchor="middle" fill="#64748B">Sprint</text>
      <rect x="178" y="0" width="68" height="22" rx="11" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="212" y="15" text-anchor="middle" fill="#64748B">Configure</text>
      <rect x="252" y="0" width="64" height="22" rx="11" fill="#2176FF"/>
      <text x="284" y="15" text-anchor="middle" font-weight="700" fill="#FFFFFF">Generate</text>
    </g>

    <!-- Generate section capsules -->
    <g transform="translate(16 84)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">
      <rect width="68" height="24" rx="12" fill="#2176FF"/>
      <text x="34" y="16" text-anchor="middle" font-weight="700" fill="#FFFFFF">Overview</text>
      <rect x="74" y="0" width="52" height="24" rx="12" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="100" y="16" text-anchor="middle" fill="#0F172A">Hours</text>
      <rect x="132" y="0" width="62" height="24" rx="12" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="163" y="16" text-anchor="middle" fill="#0F172A">Fix-ups</text>
      <rect x="200" y="0" width="58" height="24" rx="12" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="229" y="16" text-anchor="middle" fill="#0F172A">Tickets</text>
      <rect x="264" y="0" width="48" height="24" rx="12" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="288" y="16" text-anchor="middle" fill="#0F172A">KPIs</text>
    </g>

    <!-- overview chips -->
    <g transform="translate(16 124)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <rect width="120" height="64" rx="10" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="12" y="28" font-size="18" font-weight="700" fill="#0F172A">83%</text>
      <text x="12" y="46" font-size="10" fill="#0B3D91">15/18</text>
      <text x="12" y="58" font-size="10" fill="#64748B">Completion</text>

      <rect x="132" y="0" width="120" height="64" rx="10" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="144" y="28" font-size="18" font-weight="700" fill="#0F172A">0.70</text>
      <text x="144" y="46" font-size="10" fill="#0B3D91">SP / day</text>
      <text x="144" y="58" font-size="10" fill="#64748B">Velocity</text>

      <rect x="264" y="0" width="120" height="64" rx="10" fill="#EEF3FA" stroke="#D5DEEC"/>
      <text x="276" y="28" font-size="18" font-weight="700" fill="#0F172A">3</text>
      <text x="276" y="46" font-size="10" fill="#0B3D91">open · 18</text>
      <text x="276" y="58" font-size="10" fill="#64748B">Open tickets</text>

      <rect x="396" y="0" width="136" height="64" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="408" y="28" font-size="18" font-weight="700" fill="#9A3412">2</text>
      <text x="408" y="46" font-size="10" fill="#B45309">fix-ups</text>
      <text x="408" y="58" font-size="10" fill="#9A3412">Open Fix-ups →</text>
    </g>

    <!-- hours chips strip -->
    <g transform="translate(16 204)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">
      <text x="0" y="14" font-weight="700" fill="#0F172A">Hours · ticket chips</text>
      <rect y="24" width="110" height="22" rx="4" fill="#DBEAFE"/>
      <text x="55" y="39" text-anchor="middle" font-weight="600" fill="#0C4A6E">RSCDEV-1204</text>
      <rect x="118" y="24" width="110" height="22" rx="4" fill="#EDE9FE"/>
      <text x="173" y="39" text-anchor="middle" font-weight="600" fill="#5B21B6">RSCDEV-1211</text>
      <rect x="236" y="24" width="110" height="22" rx="4" fill="#FEE2E2"/>
      <text x="291" y="39" text-anchor="middle" font-weight="600" fill="#991B1B">RSCDEV-1219 ✗</text>
    </g>

    <rect x="16" y="268" width="532" height="22" rx="6" fill="#EEF3FA"/>
    <text x="28" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">sprint_report_*.html  |  sprint_report_*.md</text>
  </g>
</svg>
